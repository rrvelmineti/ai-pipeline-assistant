name: Python CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q orders_assistant claims_onboarding claims_platform app.py pages evaluation examples/orders tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run labelled pipeline scenarios
        run: python -m evaluation.scenarios

      - name: Check claims mapping and planted-error recall
        run: python -m evaluation.claims_mapping

      - name: Run platform scenarios A–F
        run: python -m evaluation.platform_scenarios

  postgres:
    name: Platform on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: claims
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CLAIMS_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-not-a-secret@localhost:5432/claims
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run platform tests on PostgreSQL
        run: python -m unittest discover -s tests -p "test_platform*" -v
      - name: Run scenarios A–F and the 100,000-row performance check on PostgreSQL
        run: python -m evaluation.platform_scenarios --performance --database-url "$CLAIMS_TEST_DATABASE_URL"
      - name: Load the demo from only the files the container image contains
        # Copies each `COPY src/ src/` path from the Dockerfile, as the image does, and loads the demo there,
        # so a file the app needs at run time cannot be left out of the image unnoticed.
        run: |
          image=$(mktemp -d)
          awk '$1 == "COPY" && $2 == $3 {print $2}' Dockerfile | while read -r path; do
            mkdir -p "$image/$path" && cp -r "$path"/. "$image/$path"
          done
          cd "$image"
          CLAIMS_DATABASE_URL="sqlite:///$image/demo.db" CLAIMS_STORAGE_DIR="$image/files" \
          CLAIMS_ENCRYPTION_KEY=ci-only-layout-check-secret-0123456789 CLAIMS_DEMO_PASSWORD=Layout-Check-Pass-1 \
          python -m claims_platform.cli seed-demo

  web:
    name: Interface (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: claims_platform_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: claims_platform_web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
