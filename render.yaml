# Render Blueprint: the Claims Onboarding and Exception Management Platform on Render's free tier.
# One web service built from the Dockerfile, and one free PostgreSQL 16 database.
# On the first start the database is empty, so the app loads the synthetic demo (scenarios A–F)
# in the background. Every demo user, including 'admin', signs in with CLAIMS_DEMO_PASSWORD,
# which Render generates: find it under the service's Environment tab.
# Synthetic data only. This pilot is not HIPAA-compliant. See docs/platform/deploy-render.md.
services:
  - type: web
    name: claims-onboarding-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CLAIMS_DATABASE_URL
        fromDatabase:
          name: claims-onboarding-db
          property: connectionString
      - key: CLAIMS_ENCRYPTION_KEY
        generateValue: true
      - key: CLAIMS_DEMO_PASSWORD
        generateValue: true
      - key: CLAIMS_SEED_DEMO
        value: "1"
      # The free tier's disk is wiped on every restart, so uploaded files are kept (encrypted) in PostgreSQL.
      - key: CLAIMS_FILE_STORE
        value: database

databases:
  - name: claims-onboarding-db
    plan: free
    databaseName: claims
    user: claims
    postgresMajorVersion: "16"
    ipAllowList: []   # no connections from outside Render; the app uses the internal address
